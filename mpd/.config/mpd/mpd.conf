# Music library location – CHANGE THIS to where your music actually is
music_directory     "~/Music"          # or "/home/yourusername/Music", or any path


# Database and state files
db_file             "~/.config/mpd/database"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"
pid_file            "~/.config/mpd/pid"
log_file            "~/.config/mpd/log"   # or "syslog" if you prefer systemd logging

# Optional but useful
auto_update         "yes"               # automatically refresh when files change
restore_paused      "yes"               # start paused after reboot

# Listen only on localhost (safer). Change later if you want network access
bind_to_address     "127.0.0.1"
# port                "6600"            # default is fine

# Audio output – choose one that matches your system

# === PipeWire (most modern Linux desktops) ===
audio_output {
    type            "pipewire"
    name            "PipeWire Sound Server"
}

